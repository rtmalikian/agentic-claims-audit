[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-claims-audit"
version = "0.1.0"
description = "Agentic Claims Audit — LangGraph AI Agent for Medical Claims Auditing with Hybrid RAG, LLM-as-Judge Evals & Citation Grounding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC BY 4.0" }
authors = [{ name = "Raphael Malikian", email = "rtmalikian@gmail.com" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
]
optional-dependencies = { langgraph = ["langgraph>=0.1"], dev = ["pytest>=8"] }

[tool.setuptools.packages.find]
include = ["aca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
